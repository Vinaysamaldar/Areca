<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="yellowFrond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgY)"/>

  <!-- Palm trunk -->
  <path d="M190 300 L195 150 L205 150 L210 300 Z" fill="#78716c"/>

  <!-- Yellowing Crown Fronds -->
  <!-- Left Frond yellowed -->
  <path d="M200 150 Q120 100 40 140 Q100 80 200 150" fill="url(#yellowFrond)"/>
  <!-- Leaflet ribbing -->
  <line x1="120" y1="110" x2="100" y2="140" stroke="#a16207" stroke-width="2"/>
  <line x1="80" y1="125" x2="60" y2="150" stroke="#78350f" stroke-width="2"/>

  <!-- Right Frond severely yellowed with necrosis -->
  <path d="M200 150 Q280 100 360 140 Q300 80 200 150" fill="url(#yellowFrond)"/>
  <line x1="280" y1="110" x2="300" y2="140" stroke="#a16207" stroke-width="2"/>
  <line x1="320" y1="125" x2="340" y2="150" stroke="#78350f" stroke-width="2"/>

  <!-- Top frond with chlorosis -->
  <path d="M200 150 Q170 60 130 50 Q180 30 200 150" fill="#facc15"/>
  <path d="M200 150 Q230 60 270 50 Q220 30 200 150" fill="#ca8a04"/>
  <path d="M200 150 Q195 40 200 30 Q205 40 200 150" fill="#eab308"/>

  <!-- Necrotic brown tip patches -->
  <ellipse cx="50" cy="138" rx="12" ry="6" fill="#78350f"/>
  <ellipse cx="350" cy="138" rx="12" ry="6" fill="#78350f"/>

  <!-- Stunted small bunch -->
  <circle cx="195" cy="165" r="5" fill="#451a03"/>
  <circle cx="205" cy="166" r="5" fill="#292524"/>

  <!-- Disease label badge -->
  <rect x="20" y="235" width="220" height="36" rx="18" fill="#d97706"/>
  <text x="130" y="258" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">⚠ YELLOW LEAF DISEASE</text>
</svg>
