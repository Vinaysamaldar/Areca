name: arecanut_disease_detection
description: "Detection of Diseases in Arecanut Plants using Deep Learning (MobileNetV2 TFLite & Flutter)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # State Management
  provider: ^6.1.2

  # Machine Learning & Image Processing
  tflite_flutter: ^0.11.0
  image: ^4.2.0

  # Device Hardware (Camera & Gallery)
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Local Offline Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Networking & Sharing
  http: ^1.2.2
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/labels.txt
    - assets/disease_info.json
    - assets/
